[project]
name = "directe-tracking"
version = "0.1.0"
description = "Climber tracking for climbing video: detection, identity through crowds, occlusion and falls (the reference implementation of Directe's tracker)"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
reid = ["boxmot>=25.0.0"]
coreml = ["coremltools>=9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["directe_tracking"]
